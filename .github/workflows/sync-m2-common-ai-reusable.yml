name: Sync M2 Common AI (reusable)

# 中央 reusable workflow：同步邏輯的 single source of truth。
# 放置路徑：.github/workflows/sync-m2-common-ai-reusable.yml
#
# 下游 repo 不複製這支，而是用一支「stub」以 uses: 呼叫它：
#   jobs.sync.uses: M2Station/M2_COMMON_AI/.github/workflows/sync-m2-common-ai-reusable.yml@main
#
# 好處：升 action 版本、改同步邏輯、改 assignee，全部只改這裡一次，
#       所有下游下次排程「自動生效」，完全不用動下游任何檔案。
#       下游 stub 只保留「何時觸發」與「給什麼權限」（GitHub 硬性要求每 repo 自帶觸發定義）。
#
# 權限：GITHUB_TOKEN 的權限由「呼叫端 stub」的 permissions 決定並向下傳遞，
#       這裡不另外宣告以免反而收窄。stub 需給 contents/pull-requests/issues: write。
# 認證：讀取公開中央 repo 免 token；在下游建立 PR 用呼叫端的 GITHUB_TOKEN。

on:
  workflow_call:
    inputs:
      ref:
        description: '中央 repo 的 branch / tag'
        type: string
        required: false
        default: 'main'
      central_repo:
        description: '中央 repo，格式 owner/name'
        type: string
        required: false
        default: 'M2Station/M2_COMMON_AI'
      assignees:
        description: '自動 PR 的 assignee（逗號或換行分隔的 GitHub 帳號）'
        type: string
        required: false
        default: 'oahsiao'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # 安全網：避免卡住的 job 空耗 runner
    env:
      # 內容來源 repo（可由呼叫端以 vars.CENTRAL_AI_REPO 覆寫後傳入）
      CENTRAL_AI_REPO: ${{ inputs.central_repo }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      # 公開 repo，無需 token
      - name: Checkout central AI config
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.central_repo }}
          ref: ${{ inputs.ref }}
          path: .central

      - name: Sync files
        id: sync
        env:
          # 透過環境變數傳入使用者可控的 ref，避免 ${{ }} 直接內插進 shell 造成 script injection
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # 同步範圍由中央 repo 的 .github/sync-manifest.txt 定義（single source of truth）。
          # 之後要新增同步範圍，只改中央 manifest，下游這支 workflow 完全不用動。
          MANIFEST='.central/.github/sync-manifest.txt'
          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::找不到中央 manifest：.github/sync-manifest.txt（請確認中央 repo 有此檔）"
            exit 1
          fi

          # manifest 每行一個路徑，相對於 .github/：
          #   行尾為 / → 資料夾，用 rsync --delete（中央沒有的檔案，下游會被刪）
          #   否則     → 單檔，用 cp 覆寫
          #   # 開頭與空行略過
          synced=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            path="$(printf '%s' "$line" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [[ -z "$path" || "$path" == '#'* ]] && continue

            # 安全防護：只允許 .github/ 底下的乾淨相對路徑。
            #   - 擋絕對路徑
            #   - 擋 . / .. 單獨作為路徑區段：會被檔案系統/rsync 正規化，
            #     例如 ./workflows/ 會落到 .github/workflows/，繞過下方 workflows/ 守衛
            #   - 擋 workflows/（GITHUB_TOKEN 無法寫 .github/workflows/）
            case "$path" in
              /*)
                echo "::error::manifest 不允許絕對路徑：$path"; exit 1 ;;
              . | .. | ./* | ../* | */./* | */../* | */. | */..)
                echo "::error::manifest 路徑不得含 . 或 .. 區段：$path"; exit 1 ;;
              workflows | workflows/ | workflows/*)
                echo "::error::manifest 不允許同步 workflows/：$path"; exit 1 ;;
            esac

            src=".central/.github/$path"
            dst=".github/$path"
            if [[ "$path" == */ ]]; then
              [[ -d "$src" ]] || { echo "::error::中央缺少資料夾：.github/$path"; exit 1; }
              mkdir -p "$dst"
              rsync -av --delete "$src" "$dst"
            else
              [[ -f "$src" ]] || { echo "::error::中央缺少檔案：.github/$path"; exit 1; }
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
            fi
            synced+=(".github/${path%/}")
          done < "$MANIFEST"

          [[ ${#synced[@]} -gt 0 ]] || { echo "::error::manifest 沒有任何有效路徑"; exit 1; }

          source_sha="$(git -C .central rev-parse HEAD)"
          rm -rf .central

          # 舊版寫的是 .github/AI_CONFIG_VERSION；改名後順手清掉遺留檔（不存在則無事）。
          rm -f .github/AI_CONFIG_VERSION

          # 只在「manifest 列出的路徑」實際有變化時才寫 version 檔並開 PR。
          # M2_COMMON_AI_VERSION 內含 synced_at 時戳，若每跑都寫會製造假 diff、每次都開空 PR；
          # 故先比對內容，相同就 changed=false，下一步略過開 PR。
          changes="$(git status --porcelain -- "${synced[@]}")"
          if [[ -n "$changes" ]]; then
            # 記錄來源版本與本次實際變更的檔案，便於追溯
            {
              echo "source_repo: ${CENTRAL_AI_REPO}"
              echo "source_ref:  ${SOURCE_REF}"
              echo "source_sha:  ${source_sha}"
              echo "synced_at:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "changed_files:"
              echo "$changes" | cut -c4- | sed 's/^/  - /'
            } > .github/M2_COMMON_AI_VERSION
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "AI config 內容無變化，略過開 PR。"
          fi

      - name: Create pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # 省略 token → 沿用呼叫端預設的 GITHUB_TOKEN，只用來「在下游 repo 建立 PR」
          # （權限由 stub 的 permissions 控制），與讀取公開中央 repo 無關（上方 Checkout 那步不帶 token）。
          # caveat：GITHUB_TOKEN 開的 PR 不會觸發 consumer 端 on: pull_request 檢查（GitHub 防遞迴）；
          #         若該 check 被設為 required，此 PR 會卡住 —— 需要時改用 PAT / GitHub App token
          #         （peter-evans FAQ；可複用 docs/adr-001-visibility.md 的 App token snippet）。
          branch: chore/sync-m2-common-ai
          delete-branch: true
          commit-message: 'chore(ai): sync Copilot config from central repo'
          title: '[M2] chore(ai): sync Copilot config from central repo'
          body: |
            Auto-generated by the **Sync M2 Common AI** workflow · 由 **Sync M2 Common AI** workflow 自動產生。

            ## English

            **What**
            Sync Copilot config files from the central repo `${{ env.CENTRAL_AI_REPO }}`.

            **Scope**
            The sync scope is defined by the central repo's `.github/sync-manifest.txt`; see the PR diff for the files actually changed.
            To add a new sync path, edit the central manifest only — no downstream workflow change is required.

            **Why**
            Maintain shared conventions and prompt files in one place to avoid per-repo drift.

            **Verification**
            - [ ] The diff contains only paths defined by the manifest
            - [ ] No repo-specific rules were overwritten (project-specific content must not live in these files)

            Source version is recorded in `.github/M2_COMMON_AI_VERSION`.

            ---

            ## 中文

            **內容（What）**
            從中央 repo `${{ env.CENTRAL_AI_REPO }}` 同步 Copilot 設定檔。

            **同步範圍（Scope）**
            同步範圍由中央 repo 的 `.github/sync-manifest.txt` 定義；本次實際變更的檔案請見 PR diff。
            新增同步範圍只需修改中央 manifest，下游 workflow 不需更動。

            **目的（Why）**
            集中維護通用規範與 prompt files，避免各 repo 各自分歧。

            **驗收（Verification）**
            - [ ] diff 僅包含 manifest 定義的路徑
            - [ ] 本 repo 專屬的規範未被覆蓋（專案特定內容不應放在這些檔案中）

            來源版本記錄於 `.github/M2_COMMON_AI_VERSION`。
          labels: |
            chore
            automated
          # 指派給維護者，讓這個自動 PR 進入其待辦清單。
          # 注意：assignee 必須是下游 repo 的協作者，否則 GitHub 會靜默忽略指派（不會使 job 失敗）。
          # 由呼叫端以 vars.SYNC_PR_ASSIGNEES 覆寫後傳入，未設定時預設 oahsiao。
          assignees: ${{ inputs.assignees }}

      # 排程失敗通常沒人看 —— 明確開 issue 通知
      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'AI config sync failed / 同步失敗',
              body: [
                '**Sync failed / 排程同步失敗**',
                '',
                'Common cause: GitHub Actions is not allowed to create PRs. ' +
                  'Enable **Settings → Actions → General → Workflow permissions → ' +
                  'Allow GitHub Actions to create and approve pull requests**.',
                '',
                '常見原因：GitHub Actions 未被允許建立 PR。請開啟 ' +
                  '**Settings → Actions → General → Workflow permissions → ' +
                  '勾選 Allow GitHub Actions to create and approve pull requests**。',
                '',
                `[View run log / 查看執行紀錄](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
              labels: ['chore', 'automated']
            });
