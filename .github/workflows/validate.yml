name: Validate AI Config

# 中央 repo 專用：任何設定檔變更都必須通過驗證才能合併。
# 放置路徑：.github/workflows/validate.yml
#
# 這支 workflow 是整套機制的保險絲 —— frontmatter 寫壞會讓所有下游 repo 的
# slash command 一起失效，因此設為必要檢查（Settings → Branches → Require status checks）。

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/copilot-instructions.md'
      - '.github/prompts/**'
      - '.github/instructions/**'
      - '.github/workflows/sync-m2-common-ai-reusable.yml'
      - 'scripts/validate.py'
      - 'templates/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 取完整歷史，否則下方 CHANGELOG 檢查的三點 diff（origin/main...HEAD）
      # 在 shallow clone 下算不出 merge base，會 fatal: no merge base（exit 128）。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate config files
        run: python scripts/validate.py

      - name: Validate sync workflows are parseable
        run: |
          python - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit(0)          # PyYAML 不在預設環境時略過，非致命
          # 下游藄 stub 與中央 reusable workflow 都要能解析（reusable 壞掉會一次弄壞全下游）。
          targets = [
              'templates/sync-m2-common-ai.yml',
              '.github/workflows/sync-m2-common-ai-reusable.yml',
          ]
          for t in targets:
              p = pathlib.Path(t)
              if not p.exists():
                  print(f'FAIL 缺少 {p}'); sys.exit(1)
              yaml.safe_load(p.read_text(encoding='utf-8'))
              print(f'OK  {p} 語法正確')
          PY

      - name: Check CHANGELOG updated
        if: github.event_name == 'pull_request'
        run: |
          # 不加 --depth=1：三點 diff 需要完整歷史才能算出 merge base（搭配 checkout 的 fetch-depth: 0）
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^\.github/(copilot-instructions\.md|prompts/|instructions/)'; then
            if ! echo "$CHANGED" | grep -q '^CHANGELOG.md'; then
              echo "::error::規範有變更但 CHANGELOG.md 未更新 —— 下游 repo 需要據此判斷是否升級"
              exit 1
            fi
          fi
